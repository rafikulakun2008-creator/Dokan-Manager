
name: Build Dokan Manager APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          unzip -q DokanManager.zip -d DokanManager

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        working-directory: DokanManager
        run: flutter create . --platforms=android --org com.dokanmanager --project-name dokan_manager

      - name: Install dependencies
        working-directory: DokanManager
        run: flutter pub get

      - name: Build APK
        working-directory: DokanManager
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dokan-Manager-APK
          path: DokanManager/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
